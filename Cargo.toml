[package]
name = "ascii-art-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A cross-platform desktop editor for converting images into ASCII art"
license = "MIT"

[workspace]
members = ["web-wasm"]
default-members = ["."]
resolver = "3"

[lib]
name = "ascii_art_generator"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:eframe",
    "dep:rfd",
    "dep:tempfile",
    "image/bmp",
    "image/gif",
    "image/jpeg",
    "image/png",
    "image/tiff",
    "image/webp",
]

[[bin]]
name = "ascii-art-generator"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"], optional = true }
image = { version = "0.25.10", default-features = false }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
tempfile = { version = "3.23", optional = true }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
