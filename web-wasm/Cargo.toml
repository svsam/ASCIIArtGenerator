[package]
name = "ascii-art-generator-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "WebAssembly adapter for ASCII Art Generator"
license-file = "../LICENSE"
repository = "https://github.com/svsam/ASCIIArtGenerator"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
ascii-art-generator = { path = "..", default-features = false }
image = { version = "0.25.10", default-features = false }
wasm-bindgen = "0.2.126"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"
